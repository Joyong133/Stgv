plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stgv.volumelock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stgv.volumelock'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 별도 키 없이 바로 설치할 수 있도록 디버그 키로 서명합니다.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
