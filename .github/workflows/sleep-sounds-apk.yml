name: 단잠 APK 빌드

on:
  push:
    paths:
      - "sleep-sounds/**"
      - ".github/workflows/sleep-sounds-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleep-sounds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK 빌드
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: danjam-apk
          path: sleep-sounds/app/build/outputs/apk/release/*.apk
