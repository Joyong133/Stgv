plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stgv.timehider'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stgv.timehider'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // 고정 서명 키: 새 버전을 기존 앱 위에 그대로 덮어 설치할 수 있게 한다.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
