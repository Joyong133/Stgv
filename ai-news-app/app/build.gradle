plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stgv.ainews'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stgv.ainews'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // 개인 설치용 공개 서명 키(비밀번호: android). 같은 키로 서명해야 새 버전을 덮어 설치할 수 있습니다.
        shared {
            storeFile file('ainews.keystore')
            storePassword 'android'
            keyAlias 'ainews'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
