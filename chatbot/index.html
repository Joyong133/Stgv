<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
<title>GPT 챗봇</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="대화 목록">
    <div class="side-head">
      <button id="newChat" class="btn primary" type="button">＋ 새 대화</button>
      <button id="closeSide" class="icon-btn only-mobile" type="button" aria-label="목록 닫기">✕</button>
    </div>
    <ul id="chatList"></ul>
    <div class="side-foot">
      <button id="openSettings" class="btn ghost" type="button">⚙ 설정</button>
    </div>
  </aside>
  <div id="backdrop" hidden></div>

  <main id="main">
    <header id="topbar">
      <button id="openSide" class="icon-btn only-mobile" type="button" aria-label="대화 목록 열기">☰</button>
      <h1 id="chatTitle">새 대화</h1>
      <span id="modelBadge" class="badge"></span>
    </header>

    <section id="messages" aria-live="polite">
      <div id="empty" class="empty">
        <div class="logo">💬</div>
        <h2>무엇이든 물어보세요</h2>
        <p id="modeDesc"></p>
        <p id="keyHint" class="hint" hidden>먼저 <button type="button" class="link" data-open-settings>설정</button>에서 OpenAI API 키를 입력해 주세요.</p>
      </div>
    </section>

    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요" aria-label="메시지 입력"></textarea>
      <button id="send" class="send" type="submit" aria-label="보내기">➤</button>
      <button id="stop" class="send stop" type="button" aria-label="응답 중지" hidden>■</button>
    </form>
  </main>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>설정</h2>
    <fieldset class="modes">
      <legend>연결 방식</legend>
      <label class="radio"><input type="radio" name="mode" value="web"> <span><b>ChatGPT 웹사이트</b><br><small>API 키 없이 내 ChatGPT 계정으로 chatgpt.com에서 답을 받아요.</small></span></label>
      <label class="radio"><input type="radio" name="mode" value="api"> <span><b>OpenAI API</b><br><small>답변이 이 화면에 바로 나와요. API 키가 필요하고 사용량만큼 요금이 나와요.</small></span></label>
    </fieldset>
    <div id="apiFields">
    <label>OpenAI API 키
      <input id="apiKey" type="password" placeholder="sk-..." spellcheck="false" autocomplete="off">
    </label>
    <p class="small">키는 <b>이 브라우저(localStorage)에만</b> 저장되고, api.openai.com 으로만 전송됩니다.
      키는 <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a> 에서 만들 수 있습니다.</p>
    <label>모델
      <input id="model" list="modelList" spellcheck="false">
      <datalist id="modelList">
        <option value="gpt-5-mini"></option>
        <option value="gpt-5"></option>
        <option value="gpt-5-nano"></option>
        <option value="gpt-4.1"></option>
        <option value="gpt-4.1-mini"></option>
        <option value="gpt-4o"></option>
        <option value="gpt-4o-mini"></option>
      </datalist>
    </label>
    <label>시스템 프롬프트 (챗봇 성격)
      <textarea id="systemPrompt" rows="4"></textarea>
    </label>
    <label>API 주소 (OpenAI 호환 서버를 쓸 때만 변경)
      <input id="baseUrl" spellcheck="false">
    </label>
    </div>
    <div class="row">
      <button id="clearAll" class="btn danger" type="button">모든 대화 삭제</button>
      <span class="grow"></span>
      <button value="cancel" class="btn ghost" formnovalidate>취소</button>
      <button id="saveSettings" value="save" class="btn primary">저장</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
