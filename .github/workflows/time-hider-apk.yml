name: 시간 숨기기 APK 빌드

on:
  push:
    paths:
      - 'time-hider/**'
      - '.github/workflows/time-hider-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK 빌드
        working-directory: time-hider
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../TimeHider.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TimeHider-apk
          path: TimeHider.apk

      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete time-hider-latest --yes --cleanup-tag || true
          gh release create time-hider-latest TimeHider.apk \
            --target "$GITHUB_SHA" \
            --title "시간 숨기기 APK" \
            --notes "휴대폰에서 TimeHider.apk 를 눌러 내려받아 설치하세요. (커밋 ${GITHUB_SHA::7})"
