plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joyong.settingslock'
    compileSdk 34

    defaultConfig {
        applicationId 'com.joyong.settingslock'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 개인용이라 빌드 기계의 기본 디버그 키로 서명합니다.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
