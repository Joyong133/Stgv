name: Build App Hider APK

on:
  push:
    branches:
      - "claude/apk-app-hide-feature-0ja7yx"
    paths:
      - "android-app-hider/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app-hider

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-hider-debug-apk
          path: android-app-hider/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release (direct download link)
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: apk-latest
          name: 앱 숨기기 APK (최신)
          body: |
            `app-debug.apk` 를 폰에서 바로 다운로드해 설치하세요(알 수 없는 출처 허용 필요).
            커밋: ${{ github.sha }}
          files: android-app-hider/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
