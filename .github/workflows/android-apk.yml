name: Build App Hider APK

on:
  push:
    branches:
      - "claude/apk-app-hide-feature-0ja7yx"
    paths:
      - "android-app-hider/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app-hider

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-hider-debug-apk
          path: android-app-hider/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
